name: Deploy to Lightsail (SSH)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Rsync files to server
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
          REMOTE_PATH: ${{ secrets.LIGHTSAIL_REMOTE_PATH }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'backups' \
            --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$USER@$HOST:$REMOTE_PATH"

      - name: Remote post-deploy commands
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
          REMOTE_PATH: ${{ secrets.LIGHTSAIL_REMOTE_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST" << 'EOF'
          set -e
          cd "$REMOTE_PATH"
          if command -v composer >/dev/null 2>&1; then
            composer install --no-dev --prefer-dist --optimize-autoloader
          fi
          # Minimal safe permissions (adjust if needed)
          find backend -type f -exec chmod 0644 {} \; || true
          find backend -type d -exec chmod 0755 {} \; || true
          # Restart web server (Bitnami first, then common variants)
          if [ -x /opt/bitnami/ctlscript.sh ]; then
            sudo -n /opt/bitnami/ctlscript.sh restart || /opt/bitnami/ctlscript.sh restart
          elif [ -x /opt/lampp/lampp ]; then
            sudo -n /opt/lampp/lampp restart || /opt/lampp/lampp restart
          elif command -v systemctl >/dev/null 2>&1; then
            sudo -n systemctl reload apache2 || sudo -n systemctl restart httpd || true
          fi
          EOF
